services:
  # ============================================================
  # 中间件层：Postgres / Redis / MinIO
  # ============================================================
  postgres:
    image: postgres:17
    container_name: echochat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echochat}
      POSTGRES_USER: ${POSTGRES_USER:-echochat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echochat_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echochat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: echochat-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server /usr/local/etc/redis/redis.conf
        fi
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: echochat-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-echochat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-echochat123456}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 应用层：Go backend
  # ============================================================
  go-service:
    build:
      context: ../backend/go-service
      dockerfile: Dockerfile
      args:
        # 国内服务器可在 deploy/.env 里设置 APK_MIRROR=mirrors.aliyun.com、GOPROXY=https://goproxy.cn,direct
        # 海外服务器/开发机留空走官方
        APK_MIRROR: ${APK_MIRROR:-}
        GOPROXY: ${GO_BUILD_PROXY:-}
    container_name: echochat-go-service
    environment:
      CONFIG_NAME: config.docker
      # Viper 使用 ECHOCHAT_ + 点号转下划线读取覆盖值。
      ECHOCHAT_SERVER_MODE: ${GO_SERVER_MODE:-debug}
      ECHOCHAT_SERVER_WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      ECHOCHAT_DATABASE_USER: ${POSTGRES_USER:-echochat}
      ECHOCHAT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-echochat_dev_2026}
      ECHOCHAT_DATABASE_DBNAME: ${POSTGRES_DB:-echochat}
      ECHOCHAT_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ECHOCHAT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-echochat}
      ECHOCHAT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-echochat123456}
      ECHOCHAT_MINIO_BUCKET: ${MINIO_BUCKET:-echochat}
      ECHOCHAT_JWT_SECRET: ${JWT_SECRET:-}
      ECHOCHAT_MEDIA_SERVER_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
    ports:
      - "${GO_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      media-server:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # 媒体层：mediasoup Node SFU
  # ============================================================
  media-server:
    build:
      context: ../media-server
      dockerfile: Dockerfile
      args:
        # 国内服务器可在 deploy/.env 里设置 APT_MIRROR=mirrors.aliyun.com
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: echochat-media-server
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3300
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-dev-internal-token-change-me}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      # 关键：公网部署时必须填服务器公网 IP，本机留空
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-}
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-40199}
      MEDIASOUP_WORKER_LOG_LEVEL: warn
      MEDIASOUP_MAX_ROUTERS: "200"
    ports:
      - "3300:3300"
      # mediasoup RTC 流量端口范围（UDP + TCP 双栈，ICE-TCP fallback 用）
      - "40000-40199:40000-40199/udp"
      - "40000-40199:40000-40199/tcp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3300/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # TURN 层：coturn（仅公网部署，profiles=public 才启动）
  # ------------------------------------------------------------
  # 本机 Demo 默认不拉起（coturn 在 profiles 里）
  # 公网部署：docker compose --profile public up -d
  #           或使用 scripts/deploy-public.sh 一键启动
  # ============================================================
  coturn:
    image: coturn/coturn:latest
    container_name: echochat-coturn
    profiles: ["public"]
    # TURN 一般需要 host 网络以便对外中继（端口映射模式会遇到
    # coturn 回包端口被 Docker NAT 改写的问题）
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --listening-port=${TURN_LISTEN_PORT:-3478}
      --tls-listening-port=${TURN_TLS_PORT:-5349}
      --min-port=${TURN_MIN_PORT:-49160}
      --max-port=${TURN_MAX_PORT:-49200}
      --realm=${TURN_REALM:-echochat}
      --user=${TURN_USERNAME:-echouser}:${TURN_PASSWORD:-echopass}
      --fingerprint
      --lt-cred-mech
      --no-multicast-peers
      --no-cli
      --no-tlsv1
      --no-tlsv1_1
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  minio_data:
